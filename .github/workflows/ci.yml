name: CI

on:
  push:
    branches: [main]
  pull_request:

# S-08 · Lo que no se verifica automáticamente, no se sostiene.
# Una regresión FALLA LA BUILD; no genera un ticket (Principio VII).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cci
          POSTGRES_PASSWORD: cci_local
          POSTGRES_DB: cci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cci -d cci"
          --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://cci:cci_local@localhost:5432/cci
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compilar contratos
        run: pnpm --filter @cci/contracts build

      - name: Tipos (strict, sin any)
        run: pnpm typecheck

      - name: Lint — incluye la frontera entre dominios (S-09)
        run: pnpm lint

      # PRIMERO la ida y vuelta, sobre una base vacía: `verificar` revierte
      # hasta cero y vuelve a aplicar, así que se lleva por delante cualquier
      # dato. Correrla después de sembrar dejaría la base vacía para las
      # pruebas, que es como estaba y por eso esta CI nunca habría pasado.
      - name: Migraciones ida y vuelta
        # Toda migración debe revertir. La que no revierte, no entra (Restricción 6).
        run: pnpm --filter @cci/api exec tsx scripts/migrar.ts verificar

      # Y DESPUÉS las semillas. Las pruebas corren contra una base real —a
      # propósito: verificar la inmutabilidad contra un doble no verificaría
      # nada— así que sin el inventario del cliente cargado, la mitad de la
      # suite falla en la primera consulta.
      - name: Base de datos con el inventario del cliente
        run: pnpm db:seed

      - name: Pruebas
        run: pnpm test

      # `pnpm start` ejecuta `node dist/main.js`: sin compilar la API no hay
      # nada que arrancar. Compilar aquí además verifica el build de producción,
      # que es distinto del que usan las pruebas.
      - name: Compilar la API
        run: pnpm --filter @cci/api build

      - name: Carga — 500 concurrentes, p95 < 200 ms (F-33)
        # Los umbrales de k6 FALLAN LA BUILD; no generan un ticket.
        env:
          # El perfil completo son 7 minutos. En CI se corre el corto, que
          # verifica que la prueba EXISTE y que los umbrales se cumplen; el
          # completo se lanza a mano contra producción antes de entregar.
          PERFIL: ci
        run: |
          # El asset de k6 lleva la versión en el nombre, así que
          # `/latest/download/<nombre-fijo>` da 404. Se resuelve la etiqueta.
          VERSION=$(curl -fsSL https://api.github.com/repos/grafana/k6/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)
          curl -fsSL "https://github.com/grafana/k6/releases/download/${VERSION}/k6-${VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/k6'
          k6 version

          pnpm --filter @cci/api start &
          npx wait-on http://localhost:3000/salud -t 90000
          k6 run tests/perf/conteo.js

  infraestructura:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Formato
        run: terraform fmt -recursive -check -diff
        working-directory: infra/terraform

      - name: Validar
        # Sin backend: valida la sintaxis y las referencias sin tocar la cuenta.
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/terraform
