# La puerta de entrada de la instancia.
#
# Un solo origen para las pantallas y para la API. No es comodidad de
# despliegue: la cookie de sesión es `SameSite=Strict` (F-14) y un navegador no
# la envía a otro sitio, así que un frontend alojado aparte recibiría 401 en
# todo. Las alternativas —bajar la cookie a `SameSite=None` con token CSRF, o
# abrir CORS con credenciales— cambian una propiedad de seguridad para resolver
# un problema de despliegue. Servirlo todo desde aquí lo elimina de raíz.
#
# El reparto es: la API son rutas ENUMERADAS y todo lo demás son las pantallas.
# En ese orden porque la superficie de la API está en el código y se puede
# listar; la del frontend no.

upstream api  { server api:3000;  keepalive 16; }
upstream web  { server web:3001;  keepalive 16; }

# La instancia está detrás de CloudFront: el IP del cliente llega en
# `X-Forwarded-For` y el `$remote_addr` es siempre el del CDN. Se conserva la
# cadena en vez de reescribirla — la API confía en el proxy (`trustProxy`) y es
# ella quien decide qué IP usar para limitar por tasa. Si nginx pusiera su
# propio IP, las 300 peticiones por minuto se repartirían entre TODOS los
# operarios de la bodega y el primero en contar dejaría fuera al resto.
map $http_x_forwarded_for $ip_cadena {
  ""      $remote_addr;
  default $http_x_forwarded_for;
}

log_format cci '$ip_cadena "$request" $status ${body_bytes_sent}b ${request_time}s';

server {
  listen 80 default_server;
  server_name _;

  access_log /var/log/nginx/access.log cci;

  # Ni versión ni servidor: no se le regala a un atacante el trabajo de
  # averiguar qué hay que buscar.
  server_tokens off;

  # Las fotos de evidencia del Auditor son lo más pesado que sube alguien.
  client_max_body_size 12m;

  # Una bodega con Wi-Fi malo tarda en subir. Cortar a los 60 s por defecto
  # convertiría una subida lenta en un conteo perdido.
  client_body_timeout 120s;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_types        application/json application/javascript text/css text/plain
                    image/svg+xml application/manifest+json;

  # ── La API ────────────────────────────────────────────────────────────────
  # La lista sale de los `@Controller` del backend y `test/rutas-enrutado.spec.ts`
  # verifica que no se quede atrás. Sin esa prueba, añadir un controlador y
  # olvidar esta línea haría que la ruta nueva devolviera el HTML de las
  # pantallas con código **200**: el cliente recibe HTML donde espera JSON, el
  # error salta al parsear, y nada apunta a nginx.
  location ~ ^/(administracion|aprendizaje|auditoria|bodegas|consulta|integracion|rondas|salud|sesion|tiempo|voz)(/|$) {
    proxy_pass http://api;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $ip_cadena;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection        "";

    # Un inventario no se cachea. Servir una respuesta guardada sería servir un
    # conteo viejo, y aquí eso es el fallo más caro que existe.
    proxy_buffering off;
    proxy_read_timeout 60s;
  }

  # ── Los estáticos de Next ─────────────────────────────────────────────────
  # Llevan hash en el nombre: son inmutables por construcción, y cachearlos un
  # año es correcto. Es lo que hace que la pantalla abra rápido en una bodega
  # con señal mala.
  location /_next/static/ {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Next ya manda su propio Cache-Control. Se descarta el suyo antes de poner
    # el nuestro: si no, la respuesta sale con la cabecera DOS veces, y ahí
    # quien decide es el navegador.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ── Todo lo demás: las pantallas ──────────────────────────────────────────
  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $ip_cadena;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_read_timeout 30s;
  }
}
